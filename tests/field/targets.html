<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goosescope field targets</title>
<style>
:root{--ui:#3F4752;--ink:#F4F2EC}
html,body{margin:0;height:100%;background:var(--ui);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
#target{position:fixed;inset:0 0 56px 0}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--ui)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:#545D69;color:var(--ink);cursor:pointer}
#label{font-variant-numeric:tabular-nums}
</style></head><body>
<div id="target"></div>
<div id="bar"><button id="prev">&larr; Prev</button><button id="next">Next &rarr;</button><span id="label"></span></div>
<script>
// AC2 (PLAN T13): une cible plein écran à la fois. Flèches gauche/droite pour naviguer; #n dans l'URL ouvre la cible n.
const T=[{"hex": "#808000", "expected": "green", "source": "olive: green or brown -> green"}, {"hex": "#008080", "expected": "blue", "source": "teal: green or blue -> blue"}, {"hex": "#40E0D0", "expected": "blue", "source": "turquoise: green or blue -> blue"}, {"hex": "#D2691E", "expected": "brown", "source": "chocolate: orange or brown -> brown"}, {"hex": "#800000", "expected": "red", "source": "maroon: red or brown -> red"}, {"hex": "#FFFACD", "expected": "yellow", "source": "lemon chiffon: yellow or white -> yellow"}, {"hex": "#E6E6FA", "expected": "purple", "source": "lavender: purple or white -> purple"}, {"hex": "#FF00FF", "expected": "pink", "source": "magenta: pink or purple -> pink"}, {"hex": "#DA70D6", "expected": "purple", "source": "orchid: purple or pink -> purple"}, {"hex": "#EE82EE", "expected": "purple", "source": "violet: purple or pink -> purple"}, {"hex": "#708090", "expected": "gray", "source": "slate gray: gray or blue -> gray"}, {"hex": "#2B2B2B", "expected": "black", "source": "very dark gray: gray or black -> black"}, {"hex": "#3B2A1A", "expected": "brown", "source": "very dark brown: brown or black -> brown"}, {"hex": "#F5F5DC", "expected": "white", "source": "beige: white or brown -> white"}, {"hex": "#FFFFF0", "expected": "white", "source": "ivory: white or yellow -> white"}, {"hex": "#DAA520", "expected": "yellow", "source": "goldenrod: yellow or orange -> yellow"}, {"hex": "#CC7722", "expected": "orange", "source": "ochre: orange or brown -> orange"}, {"hex": "#BC8F8F", "expected": "pink", "source": "rosy brown: pink or brown -> pink"}, {"hex": "#D3D3D3", "expected": "gray", "source": "light gray: gray or white -> gray"}, {"hex": "#191970", "expected": "blue", "source": "midnight blue: blue or black -> blue"}, {"hex": "#5F9EA0", "expected": "blue", "source": "cadet blue: blue or gray -> blue"}, {"hex": "#9ACD32", "expected": "green", "source": "yellow green: green or yellow -> green"}, {"hex": "#E9967A", "expected": "orange", "source": "dark salmon: orange or pink -> orange"}, {"hex": "#FA8072", "expected": "pink", "source": "salmon: pink or orange -> pink"}, {"hex": "#B8860B", "expected": "yellow", "source": "dark goldenrod: yellow or brown -> yellow"}, {"hex": "#556B2F", "expected": "green", "source": "dark olive green: green or brown -> green"}, {"hex": "#2F4F4F", "expected": "gray", "source": "dark slate gray: gray or green -> gray"}, {"hex": "#FF0000", "expected": "red", "source": "pure red"}, {"hex": "#DC143C", "expected": "red", "source": "crimson"}, {"hex": "#FFA500", "expected": "orange", "source": "orange"}, {"hex": "#FF8C00", "expected": "orange", "source": "dark orange"}, {"hex": "#FFFF00", "expected": "yellow", "source": "pure yellow"}, {"hex": "#FFD700", "expected": "yellow", "source": "gold"}, {"hex": "#008000", "expected": "green", "source": "green"}, {"hex": "#00FF00", "expected": "green", "source": "lime"}, {"hex": "#0000FF", "expected": "blue", "source": "pure blue"}, {"hex": "#1E90FF", "expected": "blue", "source": "dodger blue"}, {"hex": "#800080", "expected": "purple", "source": "purple"}, {"hex": "#8A2BE2", "expected": "purple", "source": "blue violet"}, {"hex": "#FFC0CB", "expected": "pink", "source": "pink"}, {"hex": "#FF69B4", "expected": "pink", "source": "hot pink"}, {"hex": "#8B4513", "expected": "brown", "source": "saddle brown"}, {"hex": "#A0522D", "expected": "brown", "source": "sienna"}, {"hex": "#808080", "expected": "gray", "source": "gray"}, {"hex": "#A9A9A9", "expected": "gray", "source": "dark gray"}, {"hex": "#000000", "expected": "black", "source": "black"}, {"hex": "#141414", "expected": "black", "source": "near black"}, {"hex": "#FFFFFF", "expected": "white", "source": "white"}, {"hex": "#F5F5F5", "expected": "white", "source": "white smoke"}];
let i=Math.max(0,Math.min(T.length-1,(parseInt(location.hash.slice(1))||1)-1));
function show(){const t=T[i];document.getElementById('target').style.background=t.hex;
document.getElementById('label').textContent=`${i+1}/${T.length}  ${t.hex}  expected: ${t.expected}  (${t.source})`;history.replaceState(null,'','#'+(i+1));}
document.getElementById('prev').onclick=()=>{i=(i-1+T.length)%T.length;show()};
document.getElementById('next').onclick=()=>{i=(i+1)%T.length;show()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});
show();
</script></body></html>
